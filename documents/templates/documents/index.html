<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Document processing</title>
</head>
<body>
    <h1>Document processing</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="file">Choose a PDF:</label>
        <input id="file" type="file" name="file" accept="application/pdf" required>
        <button type="submit">Upload and extract text</button>
    </form>

    <p id="message"></p>
    <pre id="text"></pre>
    <button id="classify" type="button" hidden>Classify text</button>
    <pre id="classification"></pre>
    <button id="extract-fields" type="button" hidden>Extract fields</button>
    <pre id="fields"></pre>

    <script>
        const form = document.querySelector("form");
        const message = document.querySelector("#message");
        const text = document.querySelector("#text");
        const classifyButton = document.querySelector("#classify");
        const fieldsButton = document.querySelector("#extract-fields");
        let documentId;

        async function post(url, body) {
            const response = await fetch(url, {
                method: "POST",
                headers: {"X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value},
                body,
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || "Request failed");
            return data;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
                const data = await post("{% url 'document-upload' %}", new FormData(form));
                documentId = data.document_id;
                message.textContent = data.message;
                text.textContent = data.text;
                classifyButton.hidden = false;
            } catch (error) {
                message.textContent = error.message;
            }
        });

        classifyButton.addEventListener("click", async () => {
            try {
                const data = await post(`/documents/${documentId}/classify/`);
                document.querySelector("#classification").textContent = JSON.stringify(data.classification, null, 2);
                fieldsButton.hidden = false;
            } catch (error) {
                message.textContent = error.message;
            }
        });

        fieldsButton.addEventListener("click", async () => {
            try {
                const data = await post(`/documents/${documentId}/extract-fields/`);
                document.querySelector("#fields").textContent = JSON.stringify(data.fields, null, 2);
            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
